<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Common AI-assisted product interface failure modes</title>
  <desc id="desc">Five common failure modes addressed by the skill instructions.</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ink { fill: #171A1F; } .muted { fill: #545D68; }
    .rule { stroke: #C8CDD3; stroke-width: 3; }
  </style>
  <rect width="1920" height="1080" fill="#F6F3EC"/>
  <text x="112" y="110" class="mono muted" font-size="24" font-weight="700" letter-spacing="3">THE PROBLEM / 02</text>
  <text x="112" y="230" class="sans ink" font-size="76" font-weight="760" letter-spacing="-3">When the visual default replaces the task</text>
  <text x="112" y="292" class="sans muted" font-size="32">The skill is intended to reduce these common instruction failures—not claim measured improvement.</text>
  <line x1="112" y1="352" x2="1808" y2="352" class="rule"/>

  <g class="sans">
    <text x="112" y="448" class="mono" font-size="26" fill="#B83A2D">01</text>
    <text x="210" y="448" class="ink" font-size="42" font-weight="680">Generic card grids</text>
    <text x="890" y="448" class="muted" font-size="30">Every region receives equal weight.</text>
    <line x1="112" y1="490" x2="1808" y2="490" class="rule"/>

    <text x="112" y="586" class="mono" font-size="26" fill="#B83A2D">02</text>
    <text x="210" y="586" class="ink" font-size="42" font-weight="680">Weak hierarchy</text>
    <text x="890" y="586" class="muted" font-size="30">The main decision and action compete with noise.</text>
    <line x1="112" y1="628" x2="1808" y2="628" class="rule"/>

    <text x="112" y="724" class="mono" font-size="26" fill="#B83A2D">03</text>
    <text x="210" y="724" class="ink" font-size="42" font-weight="680">Missing states</text>
    <text x="890" y="724" class="muted" font-size="30">Focus, loading, empty, error, and success disappear.</text>
    <line x1="112" y1="766" x2="1808" y2="766" class="rule"/>

    <text x="112" y="862" class="mono" font-size="26" fill="#B83A2D">04</text>
    <text x="210" y="862" class="ink" font-size="42" font-weight="680">Decorative visuals</text>
    <text x="890" y="862" class="muted" font-size="30">Elements lack an information or interaction role.</text>
    <line x1="112" y1="904" x2="1808" y2="904" class="rule"/>

    <text x="112" y="1000" class="mono" font-size="26" fill="#B83A2D">05</text>
    <text x="210" y="1000" class="ink" font-size="42" font-weight="680">Desktop simply shrunk</text>
    <text x="890" y="1000" class="muted" font-size="30">Mobile priority is never reconsidered.</text>
  </g>
</svg>
