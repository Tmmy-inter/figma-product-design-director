<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Product Design Director quick start</title>
  <desc id="desc">Four documented, platform-aligned steps for uploading and invoking the standalone skill; live verification remains pending.</desc>
  <style>
    .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .ink { fill: #171A1F; } .muted { fill: #545D68; }
    .line { stroke: #C8CDD3; stroke-width: 3; fill: none; }
  </style>
  <rect width="1920" height="1080" fill="#F6F3EC"/>
  <text x="112" y="110" class="mono muted" font-size="24" font-weight="700" letter-spacing="3">QUICK START / 05</text>
  <text x="112" y="230" class="sans ink" font-size="76" font-weight="760" letter-spacing="-3">From one file to a structured brief</text>
  <text x="112" y="292" class="sans muted" font-size="32">Standalone Markdown upload · exact command defined by the skill name</text>

  <line x1="166" y1="394" x2="166" y2="900" class="line"/>
  <g class="sans" font-size="28" font-weight="700">
    <circle cx="166" cy="420" r="44" fill="#B83A2D"/><text x="150" y="430" fill="#FFFFFF">01</text>
    <circle cx="166" cy="580" r="44" fill="#F6F3EC" stroke="#171A1F" stroke-width="3"/><text x="150" y="590" class="ink">02</text>
    <circle cx="166" cy="740" r="44" fill="#F6F3EC" stroke="#171A1F" stroke-width="3"/><text x="150" y="750" class="ink">03</text>
    <circle cx="166" cy="900" r="44" fill="#F6F3EC" stroke="#171A1F" stroke-width="3"/><text x="150" y="910" class="ink">04</text>
  </g>
  <g class="sans">
    <text x="266" y="408" class="ink" font-size="42" font-weight="680">Upload SKILL.md</text>
    <text x="266" y="454" class="muted" font-size="28">Use Figma's current Skills → Add skill flow.</text>
    <text x="266" y="568" class="ink" font-size="42" font-weight="680">Invoke /figma-product-design-director</text>
    <text x="266" y="614" class="muted" font-size="28">The frontmatter name defines the slash command.</text>
    <text x="266" y="728" class="ink" font-size="42" font-weight="680">Supply real product context</text>
    <text x="266" y="774" class="muted" font-size="28">Purpose · users · task · content · constraints · references</text>
    <text x="266" y="888" class="ink" font-size="42" font-weight="680">Review and iterate</text>
    <text x="266" y="934" class="muted" font-size="28">Check frames, states, responsive priorities, critique, and failures.</text>
  </g>

  <rect x="1350" y="420" width="458" height="310" fill="none" stroke="#171A1F" stroke-width="3"/>
  <text x="1394" y="478" class="mono" fill="#B83A2D" font-size="22">LIVE TEST GATE</text>
  <text x="1394" y="546" class="sans ink" font-size="34" font-weight="680">Import evidence pending</text>
  <text x="1394" y="606" class="sans muted" font-size="25">Record the Figma surface,</text>
  <text x="1394" y="646" class="sans muted" font-size="25">date, command shown, output,</text>
  <text x="1394" y="686" class="sans muted" font-size="25">failures, and human corrections.</text>
  <text x="112" y="1010" class="sans muted" font-size="26">Current Figma UI and access requirements must be confirmed during the live import test.</text>
</svg>
