<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">One controlled comparison</title>
  <desc id="desc">Control and skill-assisted Figma Design agent outputs from the same synthetic starting frame, runtime, and redesign brief. Observed example, not statistical validation.</desc>
  <rect width="1920" height="1080" fill="#F6F3EC"/>
  <path d="M96 64h72" stroke="#B83A2D" stroke-width="8"/>
  <text x="96" y="126" fill="#171A1F" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700">One controlled comparison</text>
  <text x="96" y="178" fill="#545D68" font-family="Arial, Helvetica, sans-serif" font-size="25">Same starting frame · Same visible runtime configuration · Same redesign brief · Skill invocation as the planned variable</text>

  <g aria-label="Control output">
    <text x="96" y="242" fill="#171A1F" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">CONTROL</text>
    <text x="220" y="242" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="18">No Skill context</text>
    <rect x="96" y="268" width="820" height="583" rx="4" fill="#FFFFFF" stroke="#C8CDD3" stroke-width="2"/>
    <image href="community-07-control-source.png" x="96" y="268" width="820" height="583" preserveAspectRatio="xMidYMid meet"/>
    <text x="96" y="890" fill="#171A1F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">First completed output · 5m 37s</text>
    <text x="96" y="924" fill="#545D68" font-family="Arial, Helvetica, sans-serif" font-size="18">Agent-internal creation retry: 1 · Operator retries: 0</text>
  </g>

  <line x1="960" y1="222" x2="960" y2="946" stroke="#C8CDD3" stroke-width="2"/>

  <g aria-label="Skill-assisted output">
    <text x="1004" y="242" fill="#171A1F" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">SKILL-ASSISTED</text>
    <text x="1194" y="242" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="18">/figma-product-design-director</text>
    <rect x="1004" y="268" width="820" height="583" rx="4" fill="#FFFFFF" stroke="#C8CDD3" stroke-width="2"/>
    <image href="community-07-skill-source.png" x="1004" y="268" width="820" height="583" preserveAspectRatio="xMidYMid meet"/>
    <text x="1004" y="890" fill="#171A1F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">First completed output · 3m 20s</text>
    <text x="1004" y="924" fill="#545D68" font-family="Arial, Helvetica, sans-serif" font-size="18">Agent-internal creation retry: 0 · Operator retries: 0</text>
  </g>

  <rect x="96" y="974" width="1728" height="58" fill="#171A1F"/>
  <text x="128" y="1012" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Observed example — not statistical validation</text>
  <text x="1792" y="1012" text-anchor="end" fill="#C8CDD3" font-family="Arial, Helvetica, sans-serif" font-size="18">Non-deterministic agent execution · Human design review required</text>
</svg>
