    .ink { fill: #171A1F; }
    .muted { fill: #545D68; }
    .line { stroke: #C8CDD3; stroke-width: 2; fill: none; }
    .accent { fill: #B83A2D; }
  </style>
  <rect width="1280" height="640" fill="#F6F3EC"/>
  <rect x="64" y="64" width="10" height="512" fill="#B83A2D"/>
