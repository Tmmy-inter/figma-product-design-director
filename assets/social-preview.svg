  <text x="278" y="490" class="mono ink" font-size="19">LAYOUT</text>
  <text x="382" y="490" class="mono muted" font-size="19">/</text>
  <text x="408" y="490" class="mono ink" font-size="19">STATES</text>
  <text x="512" y="490" class="mono muted" font-size="19">/</text>
  <text x="538" y="490" class="mono ink" font-size="19">CRITIQUE</text>
