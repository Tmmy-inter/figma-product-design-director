  <text x="104" y="286" class="sans ink" font-size="72" font-weight="760" letter-spacing="-3">Director</text>
  <text x="108" y="344" class="sans muted" font-size="28" font-weight="450">Structured product-design direction for</text>
  <text x="108" y="382" class="sans muted" font-size="28" font-weight="450">AI-assisted interface work.</text>
  <line x1="104" y1="444" x2="666" y2="444" class="line"/>
  <text x="104" y="490" class="mono ink" font-size="19">HIERARCHY</text>
